<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text decoration</title>
    <style>
        #head{
            background-color: rgb(131, 200, 57); text-decoration: line-through;
        }
        #head1{
            background-color: red;text-decoration: overline;
        }
          #head2{
            background-color: yellow;text-decoration: underline;
        }
        #link{
            background-color: rgb(204, 196, 196); text-decoration: none;
        }

    </style>
</head>
<body>
    <h1 id="head">this is my head</h1>
    <h1 id="head1">this is my head</h1>
    <h1 id="head2">this is my head</h1>
    <a href="#" id="link">This is a link</a>
</body>
</html>
