<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text properties</title>
    <style>
        body{
            margin: 0;
        }
        .box{
            height:80px;
            width: 80px; 
            margin: 10px

        }
        #box1{
            color: black; background-color: green;text-align: center;text-align:right;
          
        }
        #box2{
            color: black; background-color: red;text-align: center;
        }
        #box3{
            color: black; background-color: orange; text-align: center;
        }
    </style>
</head>
<body>
    
    <div id="box1" class="box">Box 1</div>
    <div id="box2" class="box">Box 2</div>
    <div id="box3" class="box">Box 3</div>
</body>
</html>
