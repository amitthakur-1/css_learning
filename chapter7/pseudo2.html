<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        .pseudo0{
            height: 30px;
            width: 200px;
            background-color: rgb(28, 180, 226);
            color: rgb(31, 27, 29);
            border: 2px solid black;
            border-radius: 44px;
            

        }
        .pseudo0:hover{
            background-color: yellow;
            height: 30px;
            width: 210px;
            transition: all ;transition-duration: 111ms; 
            transition-timing-function: linear; transform: scaleX(1.2);
        }
        .pseudo0:active{
            background-color: blueviolet;
            height: 32px; width: 220px;
            border: 1px; border-radius: 33px; border-style: dotted;
            transition: all; transition-delay: 100ms; 
        }
        .pseudo1{
            height: 60px;
            width: 200px;
            background-color: rgb(74, 27, 229);
            color: rgb(31, 27, 29);
            border: 3px solid rgb(49, 155, 72);
            border-radius: 100%;
            

        }
        .pseudo1:hover{
            background-color: rgb(197, 38, 146);
            height: 150px;
            width: 210px;
            transition: all ;transition-duration: 111ms; 
        }
        .pseudo1:active{
            background-color: rgb(36, 171, 40);
            height: 302px; width: 220px;
            border: 1px; border-radius: 33px; border-style:dashed;
            transition: all; transition-delay: 100ms; 
        }
        .pseudo2{
            height: 30px;
            width: 200px;
            background-color: rgb(210, 35, 146);
            color: rgb(31, 27, 29);
            border: 2px solid black;
            border-radius: 4px;
            

        }
        .pseudo2:hover{
            background-color: rgb(194, 24, 24);
            height: 30px;
            width: 210px;
            transition: all ;transition-duration: 111ms; 
        }
        .pseudo2:active{
            background-color: blueviolet;
            height: 32px; width: 220px;
            border: 1px; border-radius: 33px; border-style:double;
            transition: all; transition-delay: 100ms; 

            

        }
        
    </style>
</head>

<body>
    <button class="pseudo0">Pseudo Button</button><br><br>
    <button class="pseudo1">Pseudo Button</button><br><br>
    <button class="pseudo2">Pseudo Button</button><br><br>

</body>
</html>
