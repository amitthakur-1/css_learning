<!-- prgress bar and progress container  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PracticeSet</title><style>
        .progress-container{
            height: 25px;
            background-color: rgb(171, 179, 186);
            width:90%; border: 2px solid black;
             border-radius: 40px;
            position: relative; 
            left: 25px;
        }
        .progress-bar{
            width: 50%; height: 25px; border-radius: 40px;
            background-color: blue;
            animation: animae_progress 2s  forwards;
        }
        @keyframes animae_progress {
            0%{width: 0%;}
            90%{width: 95%;}
            95%{width: 70%;}
            100%{width: 100%;}

            
        }
    </style>
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar"></div>
      

    </div>
</body>
</html>
