<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position property</title>
    <style>
        *{
            margin: 0; padding: 0;
        }
        .box{
            background-color: seagreen;
            margin: 5px; width: 55px; height: 50px;
        }
        #box1{
            position: static;
        }
        #box2{
            position: relative;
            top: 10px; left: 50px;
        }
        #box3{
            position: absolute;
            top: 60px;

        }
        #box4{
            position: fixed;
            right: 20px;
        }




    </style>

</head>
<body>
    <div id="box1" class="box">static property</div>
    <div id="box2" class="box">relative property</div>
    <div id="box3" class="box">absolute property</div>
    <div id="box4" class="box">fixed property</div>

</body>
</html>
