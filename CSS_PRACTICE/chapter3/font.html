<!-- font will be used as 200px  and weight as 300; style means italic, etc -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>font</title>
    <style>
        
      #first {
        font-size: 30px;
        font-weight: 400;
        font-style: italic;
      }
      #second {
        font-size: 30px;
        font-weight: 500;
        font-style: oblique;
        font-family: Arial, Helvetica, sans-serif;
      }
      #third {
        font-size: 30px;
        font-style: italic;
        font-family: 'Times New Roman', Times, serif;
      }
    </style>
  </head>
  <body>
    <p id="first">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam, veritatis?
    </p>
    <p id="second">Lorem ipsum dolor sit amet.</p>
    <p id="third">
      Lorem ipsum, dolor sit amet consectetur adipisicing elit. Asperiores?
    </p>
  </body>
</html>
