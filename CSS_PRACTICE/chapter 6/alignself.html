<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align self</title>
    <style>
        *{
            padding: 0; margin: 0;
        }
        #container{
            height: 500px; width: 600px;
            border: 3px solid ;
            display: flex; text-align: center; ;
            
        }
        #box1{
            height: 250px; width: 250px; border: 2px solid black; background-color: brown; margin: 3px;
            flex-shrink: 5;

        }
        #box2{
            height: 250px; width: 250px; border: 3px black solid; background-color: violet;margin: 3px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="box1">box1</div>
    <div id="box2">box2</div></div>
</body>
</html>
