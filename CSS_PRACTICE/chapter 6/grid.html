<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align self</title>
    <style>
        *{
            padding: 0; margin: 0;
        }
        #container{
            display: grid;
            grid-template-columns:80px 100px ;
            grid-template-rows: 50px 100px;
            height: 100vh;
            border: 3px solid ;
             text-align: center; ;
            
        }
        #box1{
             border: 2px solid black; background-color: brown; margin: 3px;
             display: grid;

        }
        #box2{
             border: 3px black solid; background-color: violet;margin: 3px;
        }
         #box3{
            border: 3px black solid; background-color: skyblue;margin: 3px;}
        #box4{
            border: 3px black solid; background-color: maroon;margin: 3px;}
    </style>
</head>
<body>
    <div id="container">
        <div id="box1">box1</div>
    <div id="box2">box2</div>
    <div id="box3">box3</div>
    <div id="box4">box4</div></div>
</body>
</html>
