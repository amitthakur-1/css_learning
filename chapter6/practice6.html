 align items: it align items around the cross axis-->

<!-- GRID CONTAINER -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID CONTAINER</title><style>
#container {
  display: grid;
  grid-template-columns: repeat(2, 200px);
  gap: 10px;
}

.box {
  height: 200px;
  border: 2px solid black;
}
</style>
</head>
<body>
    <h1 style="text-align: center;text-decoration-style: solid;">GRID CONTAINER</h1>
    <div id="container"><div id="box1" class="box">flex item1</div>
    <div id="box2" class="box">flex item2</div>
    <div id="box3" class="box">flex item3</div>
    <div id="box4" class="box">flex item4</div></div>
</body>
</html>
